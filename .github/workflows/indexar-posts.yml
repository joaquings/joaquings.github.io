name: Indexar posts

# Regenera posts/index.json cuando se agrega o modifica un markdown.
# Requiere: Settings -> Actions -> General -> Workflow permissions
#           -> "Read and write permissions"

on:
  push:
    branches: [main]
    paths:
      - 'posts/**.md'

permissions:
  contents: write

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar el índice
        run: python3 build-index.py

      - name: Commitear si cambió
        run: |
          if git diff --quiet posts/index.json; then
            echo "El índice ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          git commit -m "Actualizar índice de posts"
          git push
