<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cuaderno.dev</title>
<script>
  try {
    document.documentElement.style.setProperty("color-scheme", localStorage.getItem("tema") || "dark");
  } catch (e) {}
  window.Prism = window.Prism || {};
  window.Prism.manual = true;   // el post se colorea después de insertarlo
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="post">

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <div class="container">
      <main class="content">
        <article id="post"></article>
      </main>
      <aside class="post-sidebar" id="post-sidebar"></aside>
    </div>

    <footer class="site-footer" id="footer"></footer>
  </div>
</div>

<!-- marked convierte el markdown a HTML; Prism colorea el código -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>

<script src="js/site-config.js"></script>
<script src="js/layout.js"></script>
<script src="js/posts.js"></script>
<script src="js/main.js"></script>
</body>
</html>
